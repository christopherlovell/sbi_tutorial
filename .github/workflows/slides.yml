name: Deploy slides

on:
  push:
    branches: [main]
    paths: ["slides/**", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # only needed for PDF export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - run: npm ci
      - run: npx slidev build --base /${{ github.event.repository.name }}/
      # serve the app for deep links like /sbi_tutorial/5
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
